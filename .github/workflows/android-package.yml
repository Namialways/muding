name: Android Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Prepare release signing
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_RELEASE_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_RELEASE_KEY_ALIAS" ] || \
             [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "Release signing secrets are required for tag releases." >&2
              exit 1
            fi
            echo "Release signing secrets are not configured. Manual builds will include an unsigned release APK."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore/release.jks"
          {
            echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/keystore/release.jks"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/muding-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/muding-release-signed.apk
          fi
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/muding-release-unsigned.apk
          fi
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muding-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_notes=""
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null)" = "tag" ]; then
            tag_notes="$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')"
          fi

          if [ -n "${tag_notes//[[:space:]]/}" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --notes "$tag_notes" \
              --generate-notes \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
